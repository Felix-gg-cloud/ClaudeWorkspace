server:
  port: 8083

spring:
  application:
    name: lingualeap-ai
  datasource:
    url: jdbc:postgresql://localhost:5432/ll_ai
    username: lingualeap
    password: lingualeap123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: https://models.inference.ai.azure.com
      api-key: ${GITHUB_TOKEN}
      chat:
        completions-path: /chat/completions
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 16384

app:
  proxy:
    enabled: false
    host: proxy.us.ibm.com
    port: 8080
